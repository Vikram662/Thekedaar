<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -96 752 752" width="752" height="752">
  <defs>
    <!-- Background Gradient: Ultra-dark Obsidian -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Premium Metallic Amber / Gold (Fintech feel) -->
    <linearGradient id="accentPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Secondary Depth Layer (Deep Slate Metallic) -->
    <linearGradient id="accentSecondary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Premium Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean Monogram 'T' (Geometric Precision Blocks) -->
  <g>
    <!-- Top Horizontal Bar of 'T' (Sharp, angled, modern) -->
    <path d="M 120 160 L 392 160 C 400 160, 406 166, 404 174 L 388 222 C 386 228, 380 232, 374 232 L 138 232 C 132 232, 126 228, 124 222 L 108 174 C 106 166, 112 160, 120 160 Z" 
          fill="url(#accentPrimary)" />

    <!-- Vertical Stem of 'T' (Precision pillar) -->
    <rect x="228" y="248" width="56" height="152" rx="12" 
          fill="#f8fafc" />

    <!-- Left Precision Accent Dot / Milestone Point -->
    <rect x="144" y="254" width="44" height="44" rx="10" 
          fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle cx="166" cy="276" r="6" fill="url(#accentSecondary)" />

    <!-- Right Financial / Settlement Accent Block -->
    <rect x="324" y="254" width="44" height="44" rx="10" 
          fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 338 276 L 344 282 L 354 270" 
          fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
