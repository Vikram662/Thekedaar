name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite (for database tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # android/ is not committed yet; generate it (existing files are never overwritten).
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.thekedaar --project-name thekedaar

      - name: Patch Android project (biometric, permissions, minSdk)
        run: dart run tool/patch_android.dart

      - run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      # Google Drive backup needs the Web OAuth client id (PRD D-7). Add it as a
      # repository secret named GOOGLE_SERVER_CLIENT_ID; the app builds without it.
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: thekedaar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
