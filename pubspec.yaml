name: thekedaar
description: Offline business app for contractors (thekedaar) - workers, attendance, khata, billing.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  drift: ^2.22.0
  drift_flutter: ^0.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2
  cryptography: ^2.7.0
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  local_auth: ^3.0.0
  google_sign_in: ^7.1.0
  googleapis: ">=13.0.0 <18.0.0"
  workmanager: ^0.10.0
  connectivity_plus: ">=6.0.0 <8.0.0"
  share_plus: ">=11.0.0 <14.0.0"
  file_picker: ^10.3.0
  pdf: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
