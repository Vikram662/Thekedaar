name: thekedaar
description: Offline business app for contractors (thekedaar) - workers, attendance, khata, billing.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  drift: ^2.22.0
  drift_flutter: ^0.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2
  cryptography: ^2.7.0
  flutter_secure_storage: ">=9.2.2 <11.0.0"
  local_auth: ^3.0.0
  google_sign_in: ^7.1.0
  googleapis: ">=13.0.0 <18.0.0"
  workmanager: ^0.10.0
  connectivity_plus: ">=6.0.0 <8.0.0"
  share_plus: ">=11.0.0 <14.0.0"
  file_picker: ^10.3.0
  pdf: ^3.11.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  razorpay_flutter: ^1.4.7
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/fonts/
    - assets/icon/app_icon.png

# App icon from assets/icon/app_icon.svg (PNGs rendered from it).
# CI runs: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 24

# Native launch screen shown while Flutter starts.
# CI runs: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F172A"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0F172A"
    image: assets/icon/splash_android12.png
    icon_background_color: "#0F172A"
  ios: false
  web: false
